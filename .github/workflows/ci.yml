# The workflow NAME is what GitHub prints on the status badge, so it is "CI"
# rather than "check" — the badge reads "CI | passing".
name: CI

# Public repositories get standard runners free, which is what makes a Windows
# job affordable here: a cold build is ~10-18 minutes (571 crates, with SDL3 and
# Slint both compiled from source). Warm, with the cache below, it lands around
# 2-5. workflow_dispatch stays so the suite can be kicked off by hand.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    # `target-cpu=native` AND A BUILD CACHE ARE INCOMPATIBLE ON A MIXED FLEET,
    # and this is the fix for a red that could not retry its way out.
    # `.cargo/config.toml` sets `-C target-cpu=native` (measured -9.1% ms/frame,
    # and right for a build-machine-specific binary); rust-cache restores
    # `target/*/deps/`, which holds compiled PROC-MACRO `.so`/`.dll`s that rustc
    # `dlopen`s into ITSELF. A serde_derive built on a runner with a wider ISA
    # and loaded by rustc on a narrower one is `SIGILL: illegal instruction`
    # inside `DeriveProcMacro::expand`, and the crate never compiles.
    #
    # IT FIRED ON check-vulkan, 6 of its last 10 runs, while every sibling job
    # compiled the same commit on the same OS — a different job, so a different
    # cache key, so a different blob. THE ALTERNATION IS THE PROOF, not the
    # recurrence: a red run and a green one 43 seconds apart both logged
    # `Restored from cache key "v0-rust-check-vulkan-Linux-x64-e8b3ee54-4a6f9706"
    # full match: true`. Same bytes, opposite outcome, so the variable is the
    # RUNNER and not the artifact.
    #
    # AND IT CANNOT SELF-HEAL. GitHub cache keys are write-once: a red job skips
    # the save (rust-cache's `post-if: success() || CACHE_ON_FAILURE`, and that
    # input defaults false), and a GREEN job logs "Cache up-to-date" and saves
    # nothing either. The poisoned entry outlives every re-run until its key
    # changes, which is what this does.
    #
    # WHY THE ENV VAR AND NOT `.cargo/config.toml`: rust-cache hashes every
    # CARGO*/CC*/CFLAGS*/CXX*/CMAKE*/RUST* env var into the MIDDLE key segment,
    # and assigns its PREFIX-MATCH fallback from that segment BEFORE appending
    # the lockfile hash. So RUSTFLAGS changes both the key and the fallback,
    # while `.cargo/config.toml` feeds only the LAST segment — editing it would
    # leave the fallback prefix matching and restore the same poisoned deps.
    # Nothing is lost by replacing `[build] rustflags` wholesale: that table
    # holds only `rustflags`, and the Windows `rust-lld` linker is a
    # `[target.*]` key RUSTFLAGS does not touch. It reaches proc macros only
    # because nothing here passes `--target`; if that changes, so does this.
    #
    # x86-64-v3 is the spelling `.cargo/config.toml:6` already names as the
    # portable one, so CI compiles what a distributed binary would. `native` on
    # an Intel runner enables AVX-512, which the AMD half of the fleet lacks;
    # v3 is AVX2/BMI2/FMA, which both halves have. If a hosted runner ever lands
    # below it the failure is a first-run SIGILL on all three x64 jobs at once —
    # loud, deterministic, and one token from `x86-64-v2`.
    #
    # NOT ON THE macOS JOBS, which are arm64: `native` resolves to apple-m1/m2/m3
    # there and `apple-m2` enables +bf16,+i8mm, so the same bug is LATENT — but
    # no x86 literal is valid on aarch64, nothing has fired, and a guess does not
    # belong in a fix commit. Named here rather than silently left out.
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      # lfs defaults to false, and that is deliberate: the flagless --check runs
      # on the PROCEDURAL scene, and assets/{bunny,teapot}.obj are plain git. So
      # CI never downloads a byte of the ~4 GB of LFS scene data, and the scene
      # blobs stay as pointer files that nothing opens.
      #   submodules IS required, unlike lfs: build.rs hard-fails without the
      #   NRD source at SDKs/NRD-src (NRD is the default denoiser). ~20 MB, one
      #   level deep — NRD itself has no submodules, it FetchContent's its deps.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # NRD.dll is the other half of build.rs's gate, and it is COMPILED (NVIDIA
      # ships no prebuilt binaries) — a cold CMake + DXIL build is minutes, so it
      # is cached on the submodule SHA. Only an NRD bump pays for it again.
      # Cache the built DLLs rather than the CMake tree: they are ~3 MB, and the
      # installer's early-out ("[=] nrd already installed") makes a hit a no-op.
      - name: NRD version
        id: nrdver
        shell: bash
        run: echo "sha=$(git -C SDKs/NRD-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: SDKs/NRD/bin
          key: nrd-dll-${{ runner.os }}-${{ steps.nrdver.outputs.sha }}

      # Runs the real installer component so CI and a developer machine build
      # the DLL exactly one way (incl. the configure->build->copy sequencing
      # contract that keeps the perf variant's shaders out of the standard DLL).
      - name: Build NRD
        run: .\install-prerequisites.bat nrd

      # `quick` is the right profile here and the repo argues why: it exercises
      # every exact-zero correctness gate (which are perf-independent) without
      # the ThinLTO whole-program pass. Never put a benchmark in CI — the
      # numbers this project reports are only meaningful under `release`.
      - name: Build
        run: cargo build --profile quick

      # The narrow shader-source soundness tests are ordinary Rust tests. Keep
      # them in CI as well as the larger executable gate suite below.
      - name: Unit tests
        run: cargo test --profile quick

      # No GPU on the runner and no vendor DLLs, so this is the DLL-free half:
      # the reference-ray verification, the temporal/replay families, and ~20
      # pure-math module self-tests. --check-gpu / --check-dxr need real
      # hardware and are run locally — no GitHub-hosted Windows or Linux runner
      # has a discrete GPU, so that is permanent rather than pending.
      #
      # --check-nrd is the ONE vendor-SDK gate this job can run, because it is
      # the one whose artifact the job BUILDS. Two things it gates that nothing
      # else did: N1, the library contract (version 4.17, encodings 2/1, the
      # SPIR-V binding offsets, container magic, whole-word blob sizes, layout
      # realisability) against the very DLL the step above produced -- absent
      # would SKIP, present-but-REFUSED is a FAIL, which is the drift this gate
      # exists for; and N0, whose `nrd::oracle::self_test` is called from
      # run_check_nrd and NOWHERE ELSE, so the oracle math twins were gated by
      # no CI job on any platform.
      #   The second invocation covers the perf artifact the installer also
      # builds and nothing has ever checked. LibraryDesc carries no perf bit, so
      # a DIFFERENT summed blob total is the only thing that can tell the two
      # apart at gate time -- read it, do not just watch the exit code.
      - name: Gates
        run: |
          cargo run --profile quick -- --check
          cargo run --profile quick -- --check-dlss
          cargo run --profile quick -- --check-xess
          cargo run --profile quick -- --check-fsr
          cargo run --profile quick -- --check-nrd
          cargo run --profile quick -- --check-nrd --nrd-perf

      # The render CI actually produced, so a failure can be looked at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-images
          path: |
            check.png
            check_gi.png
          if-no-files-found: warn

  # The Linux job is the DIRECT guard, and it exists because master shipped
  # broken there: `gfx::frame::with_frame` grew two parameters, the D3D12 caller
  # was updated, `src/vk/tracer.rs` was not, and a merge brought them together.
  # Nothing could see it — CI was `windows-latest` only and `mod vk` is
  # `#[cfg(unix)]`, so the ENTIRE Vulkan backend was outside CI's reach while
  # being the port under active development. `ash` is a `cfg(unix)` dependency,
  # so a plain build here compiles it and that class of break fails the job.
  #
  # DELIBERATELY NOT RUN: `--check-spirv` and `--check-vk`. Both degrade to a
  # loud SKIP + exit 0 on a bare runner (no DXC drop, no Vulkan ICD), so adding
  # them would turn a green badge into a claim about Vulkan that the run did not
  # test — the vacuity this repo's gates are written to avoid. Making them real
  # needs a cached `install-prerequisites.sh dxc` drop and a software ICD
  # (mesa-vulkan-drivers gives llvmpipe, which `--check-vk` already passes on);
  # that is worth doing, and it is a change to make on purpose, not a side
  # effect of adding a build job.
  check-linux:
    runs-on: ubuntu-latest
    # Same reasoning as the Windows job: x64 + rust-cache + `target-cpu=native`
    # is a proc-macro object that only runs on the machine that built it. This
    # job has not gone red, which is luck about which runner last wrote its
    # cache rather than a difference in exposure.
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      # Same reasoning as the Windows job: no lfs, but submodules ARE required —
      # build.rs's require_nrd() checks for the NRD SOURCE on every platform.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # THE ARTIFACT HALF APPLIES HERE TOO, and this step exists because it did
      # not always: require_nrd() used to gate the artifact behind
      # `#[cfg(windows)]` — the HOST, not the target — and now keys it on
      # `CARGO_CFG_TARGET_OS` with a real Linux arm, because the Vulkan backend
      # consumes libNRD.so (SPIR-V) exactly as D3D12 consumes NRD.dll (DXIL).
      # Same source, same tag, same encoding pins; only the shader arm differs,
      # and off WIN32 that is not even a choice. So a bare Linux clone must run
      # the installer before `cargo build` works at all, and CI is a bare clone.
      #
      # NO DXC DROP IS NEEDED, unlike `--check-spirv`: the installer passes
      # SHADERMAKE_DXC_VK_PATH only when SDKs/dxc-linux exists, and ShaderMake's
      # own CMake otherwise downloads DXC from the DirectXShaderCompiler
      # releases and falls back to it for the SPIR-V arm. The blobs are then
      # compiled by ShaderMake's DXC pin rather than this repository's — which
      # costs this job nothing, because the four gates below are the DLL-FREE
      # half and never load the library. If that ever stops being true, add
      # `./install-prerequisites.sh dxc` above and the drop takes over.
      - name: NRD version
        id: nrdver
        run: echo "sha=$(git -C SDKs/NRD-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same shape as the Windows job: cache the ~3 MB of built artifacts on the
      # submodule SHA, not the CMake tree, and let the installer's early-out
      # ("[=] nrd already installed") make a hit a no-op. `runner.os` is in the
      # key, so the .so and the .dll cannot collide.
      - uses: actions/cache@v4
        with:
          path: SDKs/NRD/bin
          key: nrd-dll-${{ runner.os }}-${{ steps.nrdver.outputs.sha }}

      # The real installer component, for the Windows job's reason: CI and a
      # developer machine build the library exactly one way, including the
      # configure->build->copy sequencing that keeps the perf arm's shaders out
      # of the standard library (do_nrd checks that with a cmp of the two).
      - name: Build NRD
        run: ./install-prerequisites.sh nrd

      # SDL3's Linux build dependencies, and THE JOB WAS RED FOR TWO DAYS
      # WITHOUT THEM. 2a2379c put `sdl3` with `build-from-source-static` in the
      # `cfg(all(unix, not(macos)))` table for the Linux window (B6b rung 1), so
      # every Linux build now compiles SDL from source — and SDL's CMake HARD
      # ERRORS at macros.cmake:415 when it finds neither X11 nor Wayland
      # development libraries ("Most likely, this is not wanted"). The runner
      # image ships neither. Both Linux jobs died in the sdl3-sys build script,
      # BEFORE rustc reached one line of this crate, from 2026-08-13 onward.
      #
      # THE PACKAGES ARE THE POINT, NOT `-DSDL_UNIX_CONSOLE_BUILD=ON`. SDL
      # documents that escape for builds that genuinely want no windows, and no
      # gate in this job opens one — but taking it would compile a configuration
      # nobody ships and leave the windowing half of `src/vk/present.rs` guarded
      # by a build that could not have windowed anyway. That is the vacuity this
      # file's check-vulkan note already argues against; a green badge would
      # stop meaning what it says the moment a window-adjacent gate lands.
      # These give SDL the same `x11 wayland` video drivers a developer box has,
      # so CI builds the SDL that ships.
      #
      # THE LIST COMES FROM THE PINNED SOURCE, NOT FROM A GUESS — a first pass
      # here reasoned about which X11 extensions a headless runner could
      # plausibly need, shipped without libXss, and bought one more red run for
      # it. `sdlchecks.cmake` in sdl3-src-3.4.12 calls SDL_missing_dependency()
      # NINE times, all inside CheckX11, and every one of them is a hard stop
      # once X11 is enabled: XCURSOR, XDBE, XINPUT, XFIXES, XSYNC, XRANDR,
      # XSCRNSAVER, XSHAPE, XTEST. Four of those headers (sync.h, shape.h,
      # Xdbe.h, Xext.h) ship in libxext-dev; scrnsaver.h and XTest.h are
      # libxss-dev and libxtst-dev, which is the pair that was missing.
      # Relevance was the wrong question to ask: SDL's list is not about what
      # this job exercises, it is about what CheckX11 refuses to configure
      # without.
      #
      # libegl-dev IS FOR COVERAGE, NOT FOR THE BUILD. CheckWayland's
      # pkg_check_modules spec is `wayland-client>=1.18 wayland-egl
      # wayland-cursor egl xkbcommon>=0.5.0`, and nothing else here provides
      # egl.pc — without it Wayland does not hard-fail, it silently switches
      # OFF, and X11 alone satisfies macros.cmake:415 so the build goes green
      # having tested none of the Wayland path e717263 exists for ("the three
      # threads Wayland forces"). A green badge over a disabled backend is the
      # vacuity again, one layer down. libdecor is a WARNING rather than a
      # dependency and is here to match a developer box, not to pass anything.
      # wayland-scanner arrives as a libwayland-dev Depends (verified in the
      # run log: libwayland-bin unpacks even under --no-install-recommends).
      #
      # LOCKSTEP WITH check-vulkan's identical step — both jobs compile the same
      # crate graph, so a package added there belongs here too. Audio and
      # joystick deps are deliberately absent, and that one IS safe to reason
      # about: SDL only warns and disables those backends, as the same log shows
      # it already doing for a missing ALSA.
      - name: SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev

      - name: Build
        run: cargo build --profile quick

      - name: Unit tests
        run: cargo test --profile quick

      # See the macOS job's note on why these images are not expected to match
      # the Windows job's byte for byte, and what must hold instead.
      #
      # --check-nrd is real here for the same reason it is on Windows: this job
      # builds the artifact. See that job's Gates comment for what N0/N1 cover
      # and why the perf invocation's blob total is the line worth reading.
      # DELIBERATELY NOT --check-spirv / --check-vk: those want a DXC drop, a
      # validator and an ICD, and live in check-vulkan so their apt/network
      # surface cannot destabilise the job that guards the ordinary build.
      - name: Gates
        run: |
          cargo run --profile quick -- --check
          cargo run --profile quick -- --check-dlss
          cargo run --profile quick -- --check-xess
          cargo run --profile quick -- --check-fsr
          cargo run --profile quick -- --check-nrd
          cargo run --profile quick -- --check-nrd --nrd-perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-images-linux
          path: |
            check.png
            check_gi.png
          if-no-files-found: warn

  # The macOS job exists because the tree now BUILDS there (M0), and the Vulkan
  # port already taught this lesson once: a test that cannot run where the
  # developer works is a test that will rot. Without this job, the one-line
  # `-lc++` fix and the portability of every `cfg(not(windows))` path are
  # guarded by nothing.
  #
  # What it covers is the DLL-free half — the CPU frustum tracer, the
  # reference-ray verification, the temporal/replay families, ~20 pure-math
  # module self-tests, and the shader-source gates. The D3D12 backend is
  # `#[cfg(windows)] mod gpu`, so none of it compiles here; that is the point of
  # the split, not a gap in the job.
  check-macos:
    runs-on: macos-latest
    steps:
      # Same reasoning as the Windows job: no lfs (the flagless --check runs the
      # PROCEDURAL scene), but submodules ARE required — build.rs's
      # require_nrd() checks for the NRD SOURCE on every platform.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Deliberately NO "Build NRD" step, unlike the Windows and Linux jobs —
      # and the reason is the TARGET, not the host. require_nrd() selects the
      # artifact off `CARGO_CFG_TARGET_OS` (NRD.dll for windows, libNRD.so for
      # linux) and returns for everything else, because NRD emits DXBC/DXIL/
      # SPIR-V and has no Metal output at all: requiring an artifact no backend
      # here could load would be a gate with no subject. The source-submodule
      # half above is platform-neutral and is what still applies.
      - name: Build
        run: cargo build --profile quick

      - name: Unit tests
        run: cargo test --profile quick

      # NOTE for anyone reading a diff of these images against the Windows job's:
      # they are NOT expected to match byte for byte. sinf/cosf/expf/powf come
      # from the system libm and are permitted to differ between platforms, and
      # the corpus uses them throughout (sky, clouds, GGX). What must hold is the
      # STRUCTURAL half these gates assert — false-sky, tmin-overshoot,
      # claim-violation and the coverage counters are exact-zero on every
      # platform, and the A/Bs are tolerance-based. A counter difference is a
      # real failure; a pixel difference across platforms is not.
      #
      # --check-nrd is here for its N0 half ALONE, and the asymmetry is worth
      # stating: `nrd::oracle::self_test` runs from that gate and nowhere else,
      # so this is real new coverage — while N1 prints an honest SKIP, because
      # require_nrd requires no artifact on a platform where NRD emits no Metal
      # shaders and nothing could load one. No --nrd-perf twin for the same
      # reason: there is no artifact for it to resolve.
      - name: Gates
        run: |
          cargo run --profile quick -- --check
          cargo run --profile quick -- --check-dlss
          cargo run --profile quick -- --check-xess
          cargo run --profile quick -- --check-fsr
          cargo run --profile quick -- --check-nrd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-images-macos
          path: |
            check.png
            check_gi.png
          if-no-files-found: warn

  # THE WASM JOB — the browser port's compile guard (Stage A/B of the
  # WASM+WebGPU plan). It proves two things and deliberately no more:
  #
  #   1. The whole crate + dependency graph TYPE-CHECKS for
  #      wasm32-unknown-unknown. Everything platform-bound is either behind a
  #      target cfg (gpu/vk/mtl/hud/input/oidn/pad, reflect/spirv) or compiles
  #      to a std stub that fails loudly at runtime — the same guard shape
  #      check-linux carries for `mod vk`: without this job, every wasm cfg in
  #      the tree is outside CI's reach while being the port under active
  #      development.
  #   2. A BARE CHECKOUT SUFFICES — no submodules, no NRD, no SDKs. That is
  #      build.rs's wasm early-out working as designed (it returns before
  #      require_nrd's submodule panic), and this job checking out WITHOUT
  #      submodules is the tooth that keeps it true: reordering the early-out
  #      below require_nrd() fails here on every push.
  #
  # NO RUSTFLAGS ENV, unlike the x64 jobs, and it is load-bearing twice over:
  # an env RUSTFLAGS replaces .cargo/config.toml's [target] tables wholesale,
  # which would strip the `getrandom_backend="wasm_js"` --cfg the wasm build
  # needs (tobj → ahash → getrandom refuses to guess an entropy source on
  # wasm). And the proc-macro cache-poisoning fix the other jobs' RUSTFLAGS
  # exists for does not apply here: with `--target` passed, host artifacts
  # (proc macros, build scripts) receive no rustflags at all, so nothing
  # ISA-specific lands in this job's cache.
  #
  # `clang` on the runner image carries the wasm32 backend, which is what
  # zstd-sys's wasm-shim arm compiles with. cargo CHECK, not build: the wasm
  # binary artifact is Stage D's subject (wasm-bindgen and a web shell); what
  # this job guards is the cfg map.
  check-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Deliberately NO `submodules: true` — see point 2 above. lfs stays off
      # like every other job.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Check (wasm32)
        run: cargo check --target wasm32-unknown-unknown --profile quick

  # THE VULKAN JOB — the backend's own gates, which until now ran on exactly one
  # developer's box. check-linux proves the tree BUILDS with `mod vk` compiled;
  # this proves the backend WORKS: --check-spirv (the corpus through DXC and
  # spirv-val) and --check-vk (a device consuming it — V0 pure logic, V1 device,
  # V3 the indirect-dispatch chain the whole wavefront design rests on, V6/V7
  # the reference and wavefront tracers scored against the CPU, V8 the hemi
  # tiers, V9 replay, V10 BC7, V12 the G-buffer pack, V18 the display stage).
  #
  # NOT V14-V17, and this line used to say "V15 NRD" and be wrong. Those four
  # live inside `run_check_vk_feed`, whose first statement is
  # `if !vk::fsr3::built()` -> print `SKIP V13` -> return, and this job never
  # installs the FidelityFX source. So four stages vanish behind ONE V13 line:
  # the green reference run printed 49 `check-vk:` lines and not one mentions
  # V14, V15, V16 or V17. The guard below says so out loud rather than letting
  # this list imply otherwise.
  #
  # SEPARATE FROM check-linux ON PURPOSE. It adds apt, a network fetch and a
  # device gate, and none of that should be able to slow or destabilise the job
  # that guards the ordinary Linux build. Jobs run in parallel so wall-clock
  # feedback is unchanged; the price is one duplicated cargo build, which is
  # runner minutes (free on a public repo) rather than latency.
  #
  # THE RUNNER HAS NO GPU, so this is llvmpipe — Mesa's software Vulkan. That is
  # a REAL second implementation, not a stub: --check-vk's own notes record the
  # suite passing on it, including a bit-identical hemisphere accumulator and
  # BC7 fidelity numbers matching RADV to the digit, which is what an
  # order-independent integrator and a spec-exact decoder should do. Ubuntu
  # noble/amd64 carries Mesa 25.2.8 via noble-updates, recent enough to clear
  # the device floor (Vulkan 1.3 + scalarBlockLayout + descriptor indexing +
  # ray query).
  check-vulkan:
    runs-on: ubuntu-latest
    # Bounded rather than trusted: llvmpipe's cost on this suite is not something
    # anyone has measured, and an unbounded software-raytracing job can burn a
    # lot of minutes before anyone looks.
    timeout-minutes: 25
    # Same reasoning as the Windows job — and this is the job it fired on, six
    # times in ten, alternating with greens off one identical cache entry.
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every Linux build needs libNRD.so (require_nrd), so this job pays the
      # same NRD step as check-linux. Same key by construction, so the two share
      # one cache: whichever job misses first builds it.
      #
      # IT DOES NOT MAKE V15 REAL, which this comment used to claim and 40bc4e8's
      # message repeated. V15's missing-library skip is never REACHED: V17, V14,
      # V15 and V16 all sit behind `run_check_vk_feed`'s `fsr3::built()` early
      # return, and this job installs NRD but not the FidelityFX source, so the
      # build prints "FSR3 disabled for the Vulkan/Metal backends" and none of
      # the four runs. libNRD.so is still required to BUILD at all
      # (require_nrd), which is why the step stays.
      - name: NRD version
        id: nrdver
        run: echo "sha=$(git -C SDKs/NRD-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: SDKs/NRD/bin
          key: nrd-dll-${{ runner.os }}-${{ steps.nrdver.outputs.sha }}

      - name: Build NRD
        run: ./install-prerequisites.sh nrd

      # IDENTICAL TO check-linux's step, and LOCKSTEP WITH IT — see that job for
      # why SDL's CMake hard-errors without these and why the console-build
      # escape is the wrong fix. This job compiles the same crate graph and died
      # in the same place, so it needs the same packages. Kept as its own step
      # rather than folded into the Vulkan tooling below so the two jobs' lists
      # can be diffed against each other by eye; the price is one extra
      # `apt-get update`, which is seconds.
      - name: SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev

      # spirv-val comes from APT, NOT from `install-prerequisites.sh spirv`, and
      # the difference matters for CI specifically: that component has no pin BY
      # DESIGN — it resolves a Google CI bucket's "latest" redirect stub at run
      # time (181 MB, and the resolved URL carries a build number and date). An
      # unpinned third-party artifact is a red build on a day nothing changed,
      # and it is the VALIDATOR, not the thing under test. noble ships
      # spirv-tools 2025.1, and run_check_spirv already falls back to `spirv-val`
      # on PATH, so apt satisfies S3 with something the image pins for us.
      #   mesa-vulkan-drivers is lavapipe; vulkan-tools is for reading
      # `vulkaninfo` out of a failed run.
      #   AND vulkan-validationlayers, WITHOUT WHICH THIS JOB HAS BEEN RUNNING
      # THE SUITE UNVALIDATED AND SAYING SO IN A LINE NOBODY READS. `Vk::new`
      # asks for VK_LAYER_KHRONOS_validation, does not find it, prints
      # "continuing UNVALIDATED", and the run ends on `check-vk: NOTE validation
      # was NOT armed`. This backend depends on that layer more than on any
      # other instrument: V5's own recorded HONEST LIMIT is that a dropped
      # binding exits 0 without it, and V18's VS/PS-swap tooth is named ONLY by
      # the layer because RADV segfaults instead of erroring. Armed-and-unread
      # is the --gpu-debug lesson; unarmed entirely is worse. The dev box runs
      # armed, so this was a silent local-vs-CI asymmetry.
      - name: Vulkan + SPIR-V tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            spirv-tools mesa-vulkan-drivers libvulkan1 vulkan-tools \
            vulkan-validationlayers

      # DXC — the SPIR-V compiler for the corpus, pinned by this repository
      # (12 MB tarball; the component fetches the 25 MB Windows zip alongside it
      # unconditionally, which is wasted here and not worth forking the script
      # over).
      #
      # AFTER "Build NRD", deliberately. Present beforehand, the drop takes over
      # SHADERMAKE_DXC_VK_PATH and NRD's embedded SPIR-V would come from this
      # pin instead of the one ShaderMake's CMake downloads for itself — a
      # change to a CACHED artifact whose key (the submodule SHA) does not
      # capture DXC_TAG, so a future pin bump would serve stale blobs forever.
      # Nothing asserted depends on which compiler produced them: N1 PRINTS the
      # summed blob bytes rather than pinning them, and the byte-count and
      # container-magic checks it does make are compiler-independent. So the
      # cheap correct fix is ordering, not a more elaborate key.
      - name: DXC version
        id: dxcver
        run: echo "tag=$(sed -n 's/^DXC_TAG=//p' install-prerequisites.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            SDKs/dxc
            SDKs/dxc-linux
          key: dxc-${{ runner.os }}-${{ steps.dxcver.outputs.tag }}

      - name: Install DXC
        run: ./install-prerequisites.sh dxc

      - name: Build
        run: cargo build --profile quick

      # GUARDED, because BOTH gates degrade to a loud SKIP + exit 0 by design —
      # the bare-checkout degrade — and a green badge claiming Vulkan coverage
      # that a run did not perform is the exact vacuity this repository's gates
      # are written to avoid. The guards assert the POSITIVE:
      #
      #   * Each gate's summary line is printed only on a path that ran. A
      #     missing DXC drop returns at `SKIP S1` and an absent device at
      #     `SKIP V1`, both BEFORE the summary — so grepping for it is an exact
      #     did-not-skip test.
      #   * CHECK-VK PASSED is necessary but NOT sufficient: a device without
      #     ray query skips V6 (and V7/V8/V9 follow) and still passes, i.e. the
      #     tracer gates would silently not run. Forbid those four by name.
      #   * V18 joins them, and it is the one stage whose CI coverage was
      #     EARNED rather than assumed: the display stage renders into an image
      #     it owns and needs no surface, so it runs on llvmpipe — measured,
      #     including the blit arm's EXACT byte identity, which two independent
      #     rasterizers agreeing on the pixel mapping is a stronger statement
      #     than either one passing alone. It skips only on a device that
      #     cannot draw at all, which this runner is not.
      #   * V11/V13 are PERMITTED to skip, and the reason that actually FIRES
      #     here is the FFX SOURCE, not the device: this job installs no
      #     FidelityFX SDK, so `fsr3::built()` is false and V13 returns before
      #     it can reach its software-device arm. Both spellings are honest;
      #     only the first is what the log shows.
      #
      #   * NOTHING ELSE CAN BE FORBIDDEN HONESTLY, and the list is exhaustive.
      #     V1/V2 return BEFORE the summary, so the grep above already covers
      #     them; V0/V3/V4/V5/V10/V12 have no skip path at all; V11/V13 are
      #     entitled. Adding `SKIP V15` would assert coverage this job does not
      #     have and would NEVER FIRE — the exact vacuity this block exists to
      #     prevent.
      #
      #   * SO THE REAL GAP IS SILENCE, NOT A SKIP LINE, and a forbid-list
      #     structurally cannot see it: V14-V17 print NOTHING here (see the NRD
      #     step's comment). The loop below asserts the POSITIVE for the
      #     thirteen stages MEASURED to run on llvmpipe. It subsumes the
      #     forbid-list — a skipping stage prints `SKIP V6`, not `V6 ` — and it
      #     is the only shape that catches a stage that goes quiet. The
      #     trailing space in the pattern is load-bearing: without it `V1`
      #     matches `V18`.
      #
      #   * And validation must be ARMED, not merely requested. The layer is
      #     installed above; a run without it reports the NOTE and gates less
      #     than this job claims.
      #
      # `set -eo pipefail` is required for `| tee` to keep the gate's exit code.
      - name: Gates (SPIR-V + Vulkan)
        shell: bash
        run: |
          set -eo pipefail
          cargo run --profile quick -- --check-spirv 2>&1 | tee spirv.log
          grep -q "CHECK-SPIRV PASSED" spirv.log \
            || { echo "::error::--check-spirv did not run (no summary line — it skipped)"; exit 1; }
          cargo run --profile quick -- --check-vk 2>&1 | tee vk.log
          grep -q "CHECK-VK PASSED" vk.log \
            || { echo "::error::--check-vk did not run (no summary line — it skipped)"; exit 1; }
          if grep -qE "SKIP (V6|V7|V8|V9|V18)" vk.log; then
            echo "::error::--check-vk passed vacuously — the tracer or display stages skipped:"
            grep -E "SKIP (V6|V7|V8|V9|V18)" vk.log
            exit 1
          fi
          for s in V0 V1 V2 V3 V4 V5 V6 V7 V8 V9 V10 V12 V18; do
            grep -q "check-vk: $s " vk.log \
              || { echo "::error::--check-vk printed no $s line at all — that stage did not run and did not say so"; exit 1; }
          done
          grep -q "check-vk: validation clean" vk.log \
            || { echo "::error::--check-vk ran UNVALIDATED — the layer is the only instrument for a whole class of defects here"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-vulkan-logs
          path: |
            spirv.log
            vk.log
          if-no-files-found: warn

  # THE METAL JOB — the only REAL GPU coverage this workflow has, because
  # macos-latest is macos-26-arm64 and the Linux/Windows runners have no GPU at
  # all. --check-fsr3 is staged like --check-vk (U0 pure staging math | U1 the
  # transpiled metallib table | U2 a real Metal device | U3 an FSR3 context |
  # U4 one scored upscale); --check-metalfx is its Apple-scaler twin.
  #
  # It landed as a `workflow_dispatch`-only probe because three things had to be
  # true and none was answerable without running. Run 31626195554 answered all
  # three, which is why the `if` is gone:
  #   1. `xcrun metal` IS on the image — an already-installed MobileAsset
  #      cryptex (MetalToolchain-v17.6.109.0, metal 32023.883), despite Xcode
  #      16.3 having split the toolchain out and the manifest not listing it. So
  #      build.rs transpiles 80/80 non-wave64 permutations, 0 failed.
  #   2. A Metal device DOES enumerate in the runner VM: "Apple Paravirtual
  #      device | unified true". Note `system_profiler SPDisplaysDataType`
  #      prints NOTHING for it — U2 is the authoritative probe, not the system
  #      tool.
  #   3. U3/U4 hold: 11 pipelines built of 80 metallibs offered, and a scored
  #      321x181 -> 642x362 upscale at energy 1.000x. 6m21s all in, which is
  #      less than this workflow's other macOS job costs.
  check-metal:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # spirv-cross transpiles the COMMITTED FidelityFX SPIR-V permutations to
      # MSL; `xcrun metal` compiles those to the .metallib table the hand-written
      # ffx_metal backend loads by content hash. No Metal shader artifact is
      # committed, so both tools are load-bearing.
      - name: spirv-cross
        run: brew install spirv-cross

      # The FSR3 SDK source — a 189 MB tarball of which ~19 MB is kept (four
      # paths). Cached on FFX_SRC_TAG now that this runs per push rather than by
      # hand; the installer's own `skip` sentinel makes a hit a no-op, so the
      # cache and the script agree on what "installed" means by construction.
      - name: FFX source version
        id: ffxver
        run: echo "tag=$(sed -n 's/^FFX_SRC_TAG=//p' install-prerequisites.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: SDKs/FidelityFX-SDK
          key: ffx-src-${{ runner.os }}-${{ steps.ffxver.outputs.tag }}

      - name: FidelityFX SDK 1.1.4 source
        run: ./install-prerequisites.sh fsr3src

      # DXC, for --check-msl: it starts from the same HLSL -> SPIR-V step
      # --check-spirv runs, so it needs SDKs/dxc-macos. Unlike the Linux job's
      # tarball this is a SOURCE BUILD (~10 min on Apple silicon): upstream
      # publishes no macOS binary at DXC_TAG, and a community build would break
      # the one-release-tag invariant that keeps the compiler emitting DXIL and
      # the one emitting SPIR-V on the same HLSL front end — the drift no gate
      # in this tree could see. Hence the cache: a miss is minutes, a hit is
      # the installer's own `skip` sentinel and costs nothing.
      #
      # SPLIT restore/save, unlike the four `actions/cache@v4` uses elsewhere in
      # this file, and the reason is the ten minutes: the combined action saves
      # in a POST step, which is skipped when any earlier step failed — so a red
      # `--check-msl` below would throw the build away and the next red run
      # would pay for it again, exactly when iteration is most expensive. Saving
      # HERE, immediately after the build, makes the gates' outcome irrelevant
      # without needing `save-always` (deprecated in cache v4.2) or an
      # `if: always()` that would also fire on a failed build. Guarded on the
      # restore's own miss, since re-saving a hit is a warning per run.
      - name: DXC version
        id: dxcver
        run: echo "tag=$(sed -n 's/^DXC_TAG=//p' install-prerequisites.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: dxccache
        with:
          path: SDKs/dxc-macos
          key: dxc-macos-${{ steps.dxcver.outputs.tag }}

      - name: DXC (source build at the pinned tag)
        run: ./install-prerequisites.sh dxc

      - uses: actions/cache/save@v4
        if: steps.dxccache.outputs.cache-hit != 'true'
        with:
          path: SDKs/dxc-macos
          key: dxc-macos-${{ steps.dxcver.outputs.tag }}

      # Kept from the probe, because it is what makes a FUTURE image change
      # readable: if the Metal toolchain ever leaves the image, the guard below
      # fails on a metallib table of zero and this step is where you see WHY in
      # one line instead of inferring it. `|| true` throughout — a missing tool
      # is an answer, and the guard is what turns it into a failure.
      - name: Probe the toolchain and the GPU
        run: |
          echo "--- xcode ---";       xcodebuild -version || true
          echo "--- xcrun metal ---"; xcrun -f metal || true
          xcrun metal --version || true
          echo "--- spirv-cross ---"; brew list --versions spirv-cross || true

      # build.rs reports the metallib table as cargo:warning lines (enumerated vs
      # emitted, and the first failure if any) — expect 80 of the 200 committed
      # permutation files, which is what a working `xcrun metal` + spirv-cross
      # produce. Zero emitted is the toolchain being gone.
      - name: Build
        run: cargo build --profile quick

      # THE VALIDATION LAYERS ARE OFF, AND THAT IS A RECORDED FINDING RATHER
      # THAN AN OVERSIGHT. Both gates print a NOTE asking to be re-run with
      # MTL_DEBUG_LAYER=1 and MTL_SHADER_VALIDATION=1, and the argument for it
      # is good (main.rs's cold-dispatch comment: the layer zero-fills
      # allocations, so FFX's UNINITIALIZED-tagged temporals stop carrying
      # per-allocation residue and the accumulating-channel count drops to
      # exactly zero — asserted as a BOUND, so zero passes, i.e. validation
      # cannot make that check vacuous). It was tried, in run 31629382154:
      #
      #   Metal API Validation Enabled / Metal GPU Validation Enabled
      #   check-fsr3: U1 metallib table OK — 80 permutations, 1148 KiB
      #   check-fsr3: U2 device — Apple Paravirtual device | unified true
      #   check-fsr3: U3 context created — 11 pipelines built of 80 offered
      #   check-fsr3: FAIL U4 the output is uniformly zero — the dispatch wrote nothing
      #
      # So the whole pipeline builds under validation and then produces NOTHING,
      # where the identical unvalidated run upscales at energy 1.000x. That is
      # either a real defect in the FSR3 Metal backend of exactly the class
      # those NOTEs enumerate (texture usage flags / storage modes) or an
      # artifact of GPU validation on a PARAVIRTUAL device — and which one it is
      # has not been established. Until it is, the job runs the configuration
      # that is PROVEN to exercise the GPU, because a red gate nobody has
      # diagnosed protects less than a green one that demonstrably ran. Do not
      # re-enable these without the answer; the first step toward it is arming
      # the two layers SEPARATELY, since only one of them is implicated.
      #
      # ONE NARROWING, from C2 (2026-08-12), and it is a narrowing rather than
      # an answer: --check-mtl — our OWN pipelines, our own dispatch, the same
      # smoke.hlsl chain — PASSES on an Apple M1 with MTL_DEBUG_LAYER=1 alone,
      # with MTL_SHADER_VALIDATION=1 alone, and with neither. So "GPU validation
      # makes a Metal compute dispatch write nothing" is NOT a general property
      # of this class of work. The two variables are still confounded, which is
      # why this is not the answer: that failure was on the PARAVIRTUAL runner
      # and this measurement is on real silicon, so it remains open whether the
      # implicated half is the layer, the device, or FFX's own resource setup
      # (the four GOTCHAs in shim/ffx_fsr3_metal.mm are all texture-shaped, and
      # C2 has no textures). Running --check-mtl under both layers ON THIS
      # RUNNER is the cheap next step — it is a 40-line chain with exact-integer
      # observables, where FSR3 is eleven pipelines and an image.
      #
      # THE GUARDS ARE ASYMMETRIC, deliberately. Unlike --check-vk, whose
      # summary is unreachable after a SKIP, these gates skip a stage and still
      # print PASSED — so PASSED alone would go green on an image that lost the
      # Metal toolchain or the GPU. --check-fsr3 is guarded HARD on its U4 line,
      # because U1-U4 are PROVEN to run here.
      #
      # --check-metalfx IS GUARDED ONLY ON PASSED, AND IT IS NEAR-VACUOUS HERE.
      # Say it plainly, because a green job printing `check-metalfx: PASSED` may
      # not otherwise read that way: run 31630969341 reports
      #
      #   check-metalfx: SKIP X1 — MTLFXTemporalScalerDescriptor.supportsDevice
      #                            is false for this device
      #
      # Apple's own temporal scaler does not support the paravirtual GPU, so
      # X2/X3 CANNOT run on this runner and no guard can make them. What is
      # actually covered here is X0 (staging math, which --check-fsr already
      # runs on all three platforms) and X1's device + texture round-trip
      # (which --check-fsr3's U2 also covers) — i.e. approximately nothing that
      # is not covered elsewhere. It stays because it costs seconds and lights
      # up by itself the day a runner image gains a device MetalFX supports;
      # it must NOT be read as MetalFX having CI coverage. Do not "tighten" the
      # guard to its X3 line: that would fail on an environment fact.
      #
      # --check-msl IS THE COVERAGE --check-metalfx CANNOT GIVE, and that is the
      # reason it is here rather than a nice-to-have: it needs the shader
      # TOOLCHAIN (spirv-cross + `xcrun metal`, both already installed above for
      # FidelityFX) and no GPU at all, so the paravirtual device that makes
      # MetalFX skip is irrelevant to it. It compiles the whole shipping corpus
      # to `.metallib` — 65 of 78 modules, the other 13 being two NAMED classes
      # its M5 line reports — so a break in the assembly, the arg set, or the
      # Metal front end fails here on every push.
      #
      # GUARDED ON M3/M4, not just on PASSED: the gate SKIPs (exit 0) when the
      # toolchain is absent, so PASSED alone would go green on an image that
      # lost spirv-cross or the Metal cryptex — the same asymmetry the two gates
      # above already carry. The M3/M4 line is printed only on a path that
      # compiled something.
      #
      # DXC IS REQUIRED FOR IT and is NOT the drop the other two use: --check-msl
      # starts from the same HLSL -> SPIR-V step --check-spirv runs, so it needs
      # SDKs/dxc-macos. That is a SOURCE BUILD on this platform (upstream ships
      # no macOS binary at the pinned tag, and using a community build would
      # break the one-release-tag invariant that keeps the DXIL and SPIR-V front
      # ends identical), so it is cached on DXC_TAG like the Vulkan job's.
      #
      # --check-mtl IS THE FIRST REAL GPU TEETH THIS JOB HAS, and it is here
      # because the runner can actually run it: --check-fsr3's U3/U4 already
      # build 11 pipelines and dispatch a scored upscale on this same
      # paravirtual device, so a compute pipeline + dispatch + readback is
      # PROVEN to work — the thing --check-metalfx cannot say. It binds and
      # dispatches smoke.hlsl, the same kernel --check-vk's V3 runs on Linux and
      # --check-gpu's smoke test runs on Windows: three backends, one kernel.
      #
      # TWO THINGS IT NEEDS THAT THE JOB ALREADY INSTALLS: spirv-cross and the
      # Metal cryptex (for --check-msl) and SDKs/dxc-macos (likewise). It adds
      # no new prerequisite; what it adds is a DEVICE requirement, which is why
      # it is a separate flag from --check-msl rather than more M-stages — that
      # gate's whole value here is that it needs no GPU at all.
      #
      # GUARDED ON K4, not just on PASSED, for the reason the two above already
      # carry: K1/K2 SKIP (exit 0) when the device or the toolchain is absent,
      # so PASSED alone would go green on a runner that lost either. K4 is the
      # line only a real dispatch prints. WHAT IS UNMEASURED ON THIS RUNNER is
      # argument-buffer tier 2 — K1 SKIPs on tier 1, which is an environment
      # fact rather than a failure, and the K4 guard is what turns that skip
      # into a red job instead of a quiet pass. If the first run reports tier 1,
      # relax the guard and say so here; do not tighten it to a line that has
      # not been proven to run (the --check-metalfx lesson below).
      #
      # ALL THREE GATES RUN BEFORE ANY GUARD IS EVALUATED. The first draft
      # asserted after each, so the fsr3 failure above exited the step and
      # --check-metalfx never ran at all — one gate's failure hid the other's
      # whole result, on the very run that was meant to tell us what MetalFX
      # does on this device.
      - name: Gates (Metal)
        shell: bash
        run: |
          set -o pipefail
          rc=0
          cargo run --profile quick -- --check-fsr3    2>&1 | tee fsr3.log    || rc=1
          cargo run --profile quick -- --check-metalfx 2>&1 | tee metalfx.log || rc=1
          cargo run --profile quick -- --check-msl     2>&1 | tee msl.log     || rc=1
          cargo run --profile quick -- --check-mtl     2>&1 | tee mtl.log     || rc=1
          grep -q "check-fsr3: PASSED" fsr3.log \
            || { echo "::error::--check-fsr3 did not pass"; rc=1; }
          grep -q "check-fsr3: U4 upscale" fsr3.log \
            || { echo "::error::--check-fsr3 did not run a real upscale — the GPU half skipped:"; grep -E "SKIP U[0-9]" fsr3.log || true; rc=1; }
          grep -q "check-metalfx: PASSED" metalfx.log \
            || { echo "::error::--check-metalfx did not pass"; rc=1; }
          grep -q "CHECK-MSL PASSED" msl.log \
            || { echo "::error::--check-msl did not pass"; rc=1; }
          grep -q "check-msl: M3/M4" msl.log \
            || { echo "::error::--check-msl compiled nothing — the toolchain skipped:"; grep -E "SKIP M[0-9]" msl.log || true; rc=1; }
          grep -q "CHECK-MTL PASSED" mtl.log \
            || { echo "::error::--check-mtl did not pass"; rc=1; }
          grep -q "check-mtl: K4" mtl.log \
            || { echo "::error::--check-mtl dispatched nothing — a stage skipped:"; grep -E "SKIP K[0-9]" mtl.log || true; rc=1; }
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-metal-logs
          path: |
            fsr3.log
            metalfx.log
            msl.log
            mtl.log
          if-no-files-found: warn
