[package]
name = "frustracer"
# The frqa QA client (src/bin/frqa.rs) makes this a two-binary crate; without
# default-run every bare `cargo run` errors asking for --bin.
default-run = "frustracer"
version = "0.1.0"
edition = "2024"
description = "A frustum tracer: beam tracing crossed with ray tracing. The screen is a quadtree; empty space is proven once per tile instead of once per pixel."
license = "MIT"
repository = "https://github.com/fechols/frustracer"
readme = "README.md"
keywords = ["raytracing", "renderer", "dxr", "direct3d12", "graphics"]
categories = ["graphics", "rendering"]
# Windows-only, and it LoadLibrary's vendor SDKs at runtime — this is an
# application, not a library anyone should depend on. `publish = false` makes an
# accidental `cargo publish` impossible while keeping the metadata above useful
# to the dependency graph and licence tooling.
publish = false

[dependencies]
glam = "0.30"
rayon = "1.10"
tobj = "4"
# Benchmark scene OBJs are committed to git LFS as zstd-compressed text
# (.obj.zst — OBJ is ASCII, ~5x); the loader decodes them transparently.
# wasm32 note (the browser port): zstd-sys has a real wasm arm (its wasm-shim
# stubs the libc surface), but building it needs a clang that can emit wasm32
# objects on PATH (ubuntu runners have one; a Windows box needs LLVM installed).
zstd = "0.13"
image = "0.25"
# glTF 2.0 loader (src/gltf_loader.rs). `import` resolves buffers (GLB bin
# chunk, external .bin, base64 URIs) — images are deliberately decoded by our
# own rayon pipeline through texture.rs, NOT gltf's serial import_images.
# No KHR_materials_sheen feature exists in 1.4 — sheen reads raw extension
# JSON via `extensions`.
gltf = { version = "1.4", default-features = false, features = [
    "import",
    "utils",
    "names",
    "extensions",
    "KHR_materials_transmission",
    "KHR_materials_ior",
    "KHR_materials_emissive_strength",
    "KHR_materials_unlit",
] }
fastrand = "2"
# JSON-persisted user settings (src/settings.rs — frustracer-settings.json
# next to the exe; the pause menu writes it, startup reads it as defaults the
# CLI overrides). Both were ALREADY in Cargo.lock transitively via gltf, so
# this adds no new downloads. Base deps, not windows-only: main() loads the
# file before the parse loop on every platform (headless --check*/--spin runs
# ignore it — gates stay a pure function of the command line).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FFT for the Poisson normal→height solve (texture.rs apply_n2h — the
# Frankot–Chellappa inverse over the wrap-repeat texture domain, where
# periodic boundary conditions are exact). Pure Rust, no runtime DLL (the
# --check* DLL-free bar); mixed-radix + Bluestein cover San Miguel's
# arbitrary/odd texture dims.
rustfft = "6"
# f16 bit-pattern storage for the CPU G-buffer planes (dlss.rs ld16/st16) —
# a base dependency, not windows-only: headless --check reads them too.
half = "2"
# CPU profiler (Tracy). Off by default — without `--features tracy` this dep
# is not even compiled and every prof:: hook is an inert no-op. The crate
# version pairs 1:1 with a Tracy server (GUI) protocol version — see the
# Profiling section in CLAUDE.md before bumping either side.
tracy-client = { version = "0.17.6", optional = true, default-features = false, features = ["enable", "broadcast"] }
# The corpus's SPIR-V arm (src/spirv.rs). `libloading` is the cross-platform
# spelling of the footprint policy every SDK in this tree already follows —
# dlopen + dlsym at run time, nothing linked, nothing in the import table — and
# it is the exact twin of gpu/dxc.rs's LoadLibraryExW + GetProcAddress.
#
# A BASE DEPENDENCY, NOT `cfg(unix)`, since --check-spirv runs on Windows: the
# only thing that ever made src/spirv.rs unix-only was DXC's `wchar_t` width,
# and both arms of that now exist. On Windows the crate resolves to
# LoadLibraryExW itself, so the DLL-free bar for every OTHER --check* is
# untouched — the library only loads when a gate asks this module to compile.
libloading = "0.8"
# The corpus's FOURTH code generator: SPIR-V -> WGSL for the browser port
# (src/wgsl.rs, gated by --check-wgsl). Pure Rust, no DLL, no loader — the
# --check* DLL-free bar is untouched. A BASE dependency, not a cargo feature,
# per the recorded rule that a gate's availability must not depend on build
# flags (the MetalFX note below); it also compiles on wasm32, where the
# browser session translates `--bake-web`'s shipped SPIR-V with this same
# naga at page load — one translator, lockfile-pinned, both sides. VERSION
# LOCKSTEP: when the WebGPU backend lands (wgpu, Stage C of the browser
# plan), wgpu's own naga must resolve to THIS major, or the gate validates
# with a different translator than the page runs.
naga = { version = "30.0.0", features = ["spv-in", "wgsl-in", "wgsl-out"] }

[features]
tracy = ["dep:tracy-client"]

# The browser port (wasm32). `getrandom` is not used directly — it is
# tobj → ahash's entropy source, and on wasm32-unknown-unknown it must be
# TOLD to use the JS backend: this feature plus the `getrandom_backend`
# --cfg in .cargo/config.toml (both halves required; either alone is a
# compile error, which is getrandom's own anti-drift design).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# The WebGPU host (Stage C of the browser plan): the `wgpu` crate, so the
# recorder that will drive the browser ALSO runs natively — over Vulkan on
# the CI runner (lavapipe), over Vulkan/D3D12/Metal on real boxes — and the
# `--check-wgpu` gate exists at all. Compute-only feature set: no `gles`
# (four backends is enough to keep honest), no `webgpu` (the wasm arm joins
# at Stage D under the wasm target table). `wgsl` must be spelled because
# default-features = false removes it, and it is the only shader front end
# the gate feeds. VERSION LOCKSTEP with naga (the note above): wgpu 30 ->
# wgpu-core 30 -> naga ^30 — one naga in the graph, one translator; check
# with `cargo tree -i naga` after any bump of either. wgpu links no DLL
# (its backends dlopen the loader/D3D12 like our own gpu/vk modules do), so
# every --check* stays DLL-free. Not on wasm32 here — matching
# `mod webgpu`'s cfg(any(unix, windows)).
[target.'cfg(any(unix, windows))'.dependencies]
wgpu = { version = "30", default-features = false, features = [
    "std", "parking_lot", "wgsl", "vulkan", "dx12", "metal",
] }
# wgpu's adapter/device requests are futures with no blocking helpers;
# pollster is the idiomatic executor (wgpu's own examples use it). Pure
# Rust, zero deps, no DLL.
pollster = "1"

# BC7 block compression of OPAQUE scene textures at load (src/bc7.rs, --bc7).
# Intel's ISPC texture compressor: an ordinary static crate dep — it ships
# prebuilt ISPC binaries, so no ISPC toolchain and no runtime DLL, which is
# what keeps every --check* DLL-free (unlike the SDKs/ LoadLibrary policy).
# Every NATIVE target, not windows-only: bc7::self_test's encode arm runs
# under --check on all three OSes. Not a base dep since the browser port
# (2026-08-18): the crate's build script panics outright on target_family
# "wasm" and its payload is prebuilt x86/ARM ISPC objects no wasm link could
# eat — web textures arrive pre-encoded from `--bake-web`, so the browser
# never encodes. src/bc7.rs keeps the vocabulary (Bc7Mode/should_compress)
# compiled everywhere and cfg's only the encoder internals off wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
intel_tex_2 = "0.5"

# The D3D12 presentation stack (SDL3 window + D3D12 + Streamline) is
# Windows-only; headless --check/--check-dlss build everywhere without it. The
# HUD (slint) is NOT here since B6b rung 4 — it lives in the "platforms with a
# window" table below, beside the Linux SDL3 entry.
[target.'cfg(windows)'.dependencies]
sdl3 = { version = "0.18", features = ["build-from-source-static", "raw-window-handle"] }
# Ogg Vorbis decode for the ambience loops (src/audio.rs) — pure Rust, zero
# unsafe, no runtime DLL (the --check* DLL-free bar; the rustfft precedent).
# Windows-only because only run_window sessions ever decode audio; core SDL3
# audio (no `mixer` feature) does the playback.
lewton = "0.10"
# Stack walking + PDB symbolization for the crash handler (src/crash.rs). Cheap
# on THIS target by construction: backtrace excludes the gimli/addr2line/object
# stack on windows-msvc and uses dbghelp instead, so the closure is ~cfg-if +
# rustc-demangle. (Cargo.lock is platform-AGNOSTIC and therefore still lists
# gimli/object/addr2line — do not read that as bloat: verified with
# `cargo tree --target x86_64-pc-windows-msvc` and by the absence of their
# rlibs in target/release/deps, only those three actually compile here.)
# It also LoadLibrary's dbghelp itself rather than importing it,
# which is the same footprint policy dxc.rs/oidn.rs/pix.rs state — so --check
# stays DLL-free (dbghelp only ever loads on an actual crash).
#
# Windows-only because the handler is: SEH, MiniDumpWriteDump, and the one
# frustracer.pdb that spans both the Rust code and the cc-built shim/*.cpp.
backtrace = "0.3"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    # Interface types + CLSIDs only — DxcCreateInstance is resolved at runtime
    # via GetProcAddress (gpu/dxc.rs) so nothing imports dxcompiler.dll.
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # Crash handler (src/crash.rs): the exception TYPES (EXCEPTION_POINTERS /
    # EXCEPTION_RECORD / CONTEXT / MINIDUMP_*) plus SetUnhandledExceptionFilter,
    # which is kernel32 and always present — so linking it breaks no policy.
    # MiniDumpWriteDump is deliberately NOT called through this feature: it
    # lives in dbghelp.dll and is resolved with GetProcAddress (the pix.rs
    # pattern), so nothing imports dbghelp and a missing/old one degrades to
    # "stack printed, no dump" instead of failing the link.
    "Win32_System_Diagnostics_Debug",
    # EXCEPTION_POINTERS / EXCEPTION_RECORD / CONTEXT live behind this one in
    # windows-rs 0.62 — Diagnostics_Debug alone configures them out.
    "Win32_System_Kernel",
    "Win32_Security",
    # 500 Hz input integrator (src/flycam.rs): GetAsyncKeyState / cursor +
    # window queries / ScreenToClient / timeBeginPeriod fallback / XInput.
    # All read live OS state from any thread — which is what lets the
    # integrator run while the main thread is blocked in a trace.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_UI_Input_XboxController",
] }

# `libloading` USED TO LIVE HERE and no longer does — it is a base dependency
# now (see the [dependencies] block), because src/spirv.rs stopped being
# unix-only. Nothing was added to the Windows build that it does not use: the
# module it serves compiles there.
#
# `ash` is the raw Vulkan API — a generated binding, not a framework: no
# allocator, no render graph, no policy of its own, which is what makes it the
# peer of `windows`'s D3D12 module rather than a second engine. Its DEFAULT
# `loaded` feature is the same footprint policy again (it dlopens
# libvulkan.so.1 through `libloading` and resolves every entry point by
# symbol), so a box with no Vulkan loader gets a clean error instead of a
# failed exec. unix-only for now because `src/vk/` is: nothing here forbids
# Vulkan on Windows — the shader half of that already moved — but the Windows
# build must not gain a dependency it does not yet use.
[target.'cfg(unix)'.dependencies]
ash = "0.38"

# The Linux window (src/vk/present.rs, B6b rung 1). The SAME crate the Windows
# block builds, at the same version and the same `build-from-source-static`
# linkage, so there is one SDL3 in this tree rather than two configurations of
# one.
#
# NOT IN THE `cfg(unix)` BLOCK ABOVE, and the block's own neighbour comment is
# why: `cfg(unix)` already applies on macOS, so putting it there would make
# every macOS build — including the CI job, which is a bare clone — compile SDL3
# from source for a presenter that platform does not have and is not getting
# (there is no Metal tracer and no Metal presentation stage). The cfg spelled
# here is `run_cinematic_vk`'s own, which is the existing statement of "the
# Vulkan backend, on the platform that drives it".
#
# THE FEATURE SET IS TWO NAMES AND BOTH ARE LOAD-BEARING. `ash` is
# `sdl3-sys/use-ash-v0-38`, an EXACT match for our `ash = "0.38"` above, which
# makes `Window::vulkan_create_surface` hand back an `ash::vk::SurfaceKHR`
# rather than a raw integer — a typed handoff with no transmute at the one
# place this tree crosses from a windowing library into its own backend.
# `build-from-source-static` matches Windows rather than taking the system
# library: `sdl3-sys` is `0.6.7+SDL-3.4.12` and the system SDL3 on the
# development box is 3.4.2, so `use-pkg-config` is an ABI skew that fails at
# link time on any symbol added between them. It stays the documented escape if
# the source build is ever the wrong trade, with that caveat attached.
#
# DELIBERATELY NOT `raw-window-handle`, which the Windows block does carry: that
# exists for `sdl_hwnd`, and `vulkan_create_surface` is what replaces it here —
# SDL names the platform surface extension itself, so `src/vk/` needs no
# xlib/xcb/wayland code at all. Cargo does not unify features across two target
# tables, so the Windows block is untouched by this.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
sdl3 = { version = "0.18", features = ["build-from-source-static", "ash"] }

# THE PLATFORMS WITH A WINDOW — Windows (src/gpu/) and Linux (src/vk/present.rs)
# — and therefore the HUD/pause-menu UI (src/hud/), which both windows composite
# (gpu/hud.rs and vk/hud.rs, B6b rung 4). ONE entry rather than one per target
# table: cargo unifies features across tables anyway, and a single spelling is
# what keeps the two windows on one Slint feature set by construction.
#
# NOT `cfg(unix)` and not `[dependencies]`, for the sdl3 block's reason: macOS
# has no window (src/mtl/ is headless and gated) and wasm32 has no Slint, and
# either would otherwise compile the slint! macro compiler — the largest single
# dependency closure in this tree — for a presenter that platform has not got.
# `mod hud` / `mod input` in main.rs carry this same cfg.
#
# Slint's SOFTWARE renderer only — no winit/femtovg/skia backends compile
# (default-features off), because the renderer draws into OUR CPU buffer behind
# a custom slint::platform::Platform and the result is dirty-rect-uploaded onto
# the swapchain by the backend's hud module. `software-renderer-systemfonts`
# rasterizes system fonts at runtime, which is what lets the UI live in a
# slint! macro with no slint-build/pre-rendered-glyph step. ON LINUX THAT
# FEATURE HARD-LINKS libfontconfig: slint std → i-slint-renderer-software/std →
# fontique `system` → yeslogic-fontconfig-sys, whose build.rs pkg-config's
# `fontconfig` and fails the build without the dev package (CI installs
# libfontconfig-dev; the binary gains a libfontconfig.so.1 NEEDED). There is no
# embedded fallback font on Linux, so a box with no system fonts draws no
# glyphs — loud rather than silent is the trade taken. Licensing: Slint is
# triple-licensed (GPLv3 / Royalty-Free / commercial); this project uses it
# under the Royalty-Free license (https://slint.dev/terms-and-conditions).
[target.'cfg(any(windows, all(unix, not(target_os = "macos"))))'.dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
] }

# The Metal backend (src/mtl/) — FSR3 upscaling, headless and gated. Generated
# Objective-C bindings, not a framework: objc2 brings no allocator, no render
# graph and no policy, exactly as `ash` brings none for Vulkan.
#
# `default-features = false` + a named feature per Metal header, because
# objc2-metal gates each header behind a same-named feature and the default set
# is the whole framework.
#
# THE LIST WAS "DELIBERATELY SHORT" AND IS NOW MERELY EXPLICIT, and that is a
# scope change rather than a slip. Until C2 the Rust side only created a device,
# textures and a command buffer and read bytes back, because shim/ffx_metal.mm
# built every pipeline on the FFX side; C2 (src/mtl/bind.rs) binds and
# dispatches OUR OWN corpus kernels, so it records a compute pass and builds
# pipelines from Rust. The claim that replaced this one is per-entry below.
#
# The old wording also said "no MTLLibrary", which was never true: objc2-metal's
# own `MTLDevice` feature pulls `MTLLibrary`, `MTLResource` and `MTLGPUAddress`,
# so it has been in the build from the first commit. Naming it is the same
# invisible-widening complaint the MetalFX block below already makes about
# itself.
#
# `MTLSampler` USED TO BE ON THE STAY-OUT LIST AND IS NOW REQUIRED, which is a
# scope change and is recorded rather than quietly edited. C3 binds the corpus's
# own `SamplerState`s (`trace_common.hlsli`'s samp_lin/samp_aniso, and the
# mtlbind probe's clamp/repeat pair), and an argument-buffer sampler is an
# `MTLSamplerState` object on this backend exactly as it is a `vk::Sampler` on
# Vulkan — D3D12's static-sampler spelling has no Metal analogue. The feature
# gates `MTLArgumentEncoder::setSamplerState:atIndex:` itself, so without it the
# method does not exist. It pulls nothing new: `MTLSamplerDescriptor` needs only
# NSObject/NSString, both already in the graph.
#
# `MTLHeap` and `MTLIndirectCommandBuffer` (which is GPU-encoded command LISTS,
# a different thing from indirect dispatch — do not add it on the name) stay
# out.
#
# THIS USED TO SAY "and every MTL4* stay out", AND IT WAS FALSE THE DAY IT WAS
# WRITTEN — refuted by this same file, in the `objc2-metal-fx` block below.
# The dates are the whole lesson: B3 (`d88fd05`) added `objc2-metal-fx`, which
# additively enables `objc2-metal/MTL4Compiler` for the entire graph, AND wrote
# the note below admitting it. C2 (`756441a`) then wrote "every MTL4* stay out"
# HERE, one screen above that note and well after it (`git log
# d88fd05..756441a` is 38 commits long). Nobody lied and nothing regressed; a
# stay-out list states an INTENTION, an invisible widening does not ask its
# permission, and the two statements never had to meet.
#
# Corrected rather than deleted, because the wrong one is the one a reader
# reaches first. What was true at C2 is the narrower claim: `grep -rn MTL4 src/
# shim/` was EMPTY, so no MTL4 API was called anywhere in our own code —
# `MTL4Compiler` was in the build without a caller.
#
# AND THAT IS NO LONGER TRUE EITHER, as of D4. `src/mtl/mtl4.rs` runs the smoke
# chain through MTL4CommandQueue / MTL4CommandBuffer / MTL4CommandAllocator /
# MTL4ArgumentTable / MTLResidencySet, so the grep now answers. Kept in place
# and dated rather than rewritten to the present tense: the lesson above is
# about a stay-out list going stale without anyone lying, and a reader who
# arrives with that expectation needs to see BOTH the intention and the two
# separate days it stopped holding. `MTL4Compiler` remains the one MTL4 feature
# in the graph with no caller of ours — see the D4 block in the feature list.
#
# NOTE the `cfg(unix)` block above already applies on macOS (ash + libloading
# are pulled in and compile there); this is additive and touches neither.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NOTE objc2-foundation is deliberately NOT a direct dependency: nothing under
# src/ names it, and the one Foundation type that reaches us (NSError, off
# MTLCommandBuffer::error) arrives through objc2-metal's own dependency on it.
#
# block2 IS a direct dependency, and the asymmetry is not an oversight. The rule
# above works because we only ever RECEIVE an NSError — objc2-metal hands it to
# us and we call one method on it. D4b has to CONSTRUCT something: MTL4's only
# error channel is a callback, `MTL4CommitOptions::addFeedbackHandler:` takes a
# block, and objc2-metal does NOT re-export block2 (checked: its lib.rs
# re-exports only its own modules), so `RcBlock::new` is reachable only by
# naming the crate ourselves.
#
# It costs no compile. `cargo tree --target aarch64-apple-darwin` (2026-08-19)
# already showed block2 0.6 in this build twice over — objc2-metal enables it
# for objc2-metal-fx's MTLFX* features, and wgpu-hal enables it independently.
# Naming it here converts an accident into an intention, which is exactly the
# lesson the MTL4Compiler note below records: a stay-out list states an
# INTENTION, and an invisible widening does not ask its permission.
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    # MTLAllocation is not optional decoration: the MTLTexture TRAIT is
    # re-exported under `all(MTLAllocation, MTLResource, MTLTexture)`, so
    # without it the headers compile and the trait simply is not in the root
    # ("no `MTLTexture` in the root").
    "MTLAllocation",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLBlitCommandEncoder",
    "MTLTexture",
    "MTLResource",
    "MTLPixelFormat",
    "MTLTypes",
    # C2 — binding and dispatching the corpus's own kernels (src/mtl/bind.rs).
    # MTLAllocation above is load-bearing TWICE more, and both are silent: it
    # also gates `MTLComputeCommandEncoder::useResource:usage:` (residency,
    # `all(MTLAllocation, MTLResource)`) and `newBufferWithLength:options:`.
    # Drop it and the one call that argument buffers make MANDATORY simply
    # ceases to exist as a method.
    "MTLBuffer",
    "MTLLibrary",
    "MTLComputePipeline",
    "MTLComputeCommandEncoder",
    # The DERIVED argument-buffer map. `MTLArgumentEncoder` writes each member
    # at the offset the COMPILED FUNCTION declares, so nothing here assumes a
    # struct layout; `MTLArgument` is the concrete reflection class that names
    # the members. The non-deprecated route (`MTLComputePipelineReflection::
    # bindings()` -> `MTLBufferBinding::bufferStructType()`) is unreachable in
    # objc2 0.6: `MTLBufferBinding` is an `extern_protocol!`, and there is no
    # `DowncastTarget` for `ProtocolObject`, so a `dyn MTLBinding` cannot be
    # narrowed to it without hand-rolled `msg_send!`.
    "MTLArgumentEncoder",
    "MTLArgument",
    "MTLDataType",
    "MTLFunctionConstantValues",
    # C3 — the corpus's own samplers, encoded INTO those argument buffers. See
    # the scope-change note above; this line replaces a "stays out" claim.
    "MTLSampler",
    # D4 — THE METAL 4 SUBMISSION PATH (`src/mtl/mtl4.rs`). This block is what
    # turns "no MTL4 API is called anywhere in our own code" from true to false;
    # the note above the dependency table is corrected rather than deleted.
    #
    # MTL4Compiler is NOT here, and its absence is a measurement rather than an
    # omission: `MTL4ComputeCommandEncoder::setComputePipelineState:` takes a
    # plain `MTLComputePipelineState` — the object `bind::Kernel` already builds
    # through the Metal 3 route — so the new path SHARES the pipeline with the
    # old one and the byte-compare between them has one fewer variable. (It is
    # in the graph anyway, pulled in by `objc2-metal-fx`; see the note below.)
    "MTL4CommandQueue",
    "MTL4CommandBuffer",
    "MTL4CommandAllocator",
    "MTL4CommandEncoder",
    "MTL4ComputeCommandEncoder",
    "MTL4ArgumentTable",
    # MANDATORY, not optional bookkeeping. MTL4 has NO `useResource:` on any
    # encoder — checked against every `MTL4*` binding in the crate — so
    # residency is expressible only through this, and `MTL4ArgumentTable`'s
    # `setAddress:atIndex:` takes a RAW GPU ADDRESS rather than a buffer
    # object, which is why: Metal can no longer infer residency from what was
    # bound. A resource bound but not resident is a use-after-free on this
    # path, not a validation message.
    "MTLResidencySet",
    # `MTLBuffer::gpuAddress()` and the argument table's `setAddress:` both
    # live behind it — the type, not a capability.
    "MTLGPUAddress",
    # D4b — THE COMMIT-FEEDBACK CHANNEL, which is BOTH the error report and the
    # completion signal. Those are one feature rather than two because MTL4
    # makes them one thing: there is no `waitUntilCompleted`, and there is no
    # synchronous `error` anywhere either — not on the queue, not on the command
    # buffer, not on the allocator (checked against all 32 generated `MTL4*`
    # files). `MTL4CommitFeedback` is the only channel that carries either, so
    # the wait is built ON it rather than beside it.
    #
    # D4 shipped the beside-it version — `MTLEvent` plus
    # `waitUntilSignaledValue:timeoutMS:` — and `Mtl4`'s own doc explained at
    # length why the error half could not simply be bolted on: a handler ordered
    # against nothing the wait observes reports "no error" identically when it
    # has not run yet. `MTLEvent` is gone from this list with that wait, and
    # NOTHING ELSE IN THE TREE USED IT (`grep MTLSharedEvent src/` had one
    # consumer, the function being replaced).
    "MTL4CommitFeedback",
    # The handler is a BLOCK, so it needs `block2` — which costs nothing, and
    # that is a measurement rather than a hope. `cargo tree --target
    # aarch64-apple-darwin` (2026-08-19) already shows `block2` 0.6 compiled
    # into this build, pulled in by `objc2-metal` through `objc2-metal-fx`'s
    # `MTLFX*` features. Enabling it here turns on binding code in a crate
    # already being compiled against a crate already being compiled.
    #
    # `dispatch2` is DELIBERATELY NOT HERE and would be the only real cost:
    # `MTL4CommandQueueDescriptor::feedbackQueue` is gated behind it and IS NOT
    # NEEDED, because the binding's own doc settles it — *"If you set the value
    # of property to `nil`, the default, Metal allocates an internal dispatch
    # queue to service feedback notifications."* We set nothing and Metal
    # provides the serial queue. (Which is also why the handler runs on ANOTHER
    # THREAD, and why `Mtl4`'s rendezvous is a Mutex/Condvar rather than the
    # `Cell` the event-based wait could use.)
    "block2",
    # `MTL4CommitFeedback::GPUStartTime`/`GPUEndTime` are behind it, and they
    # are not a nicety: they are this rung's PROOF THE HANDLER REACHED US.
    # Timestamps the platform fills in are evidence the block ran with real
    # data; "no error" from a block that never ran is the `FR_ABL` probe-reach
    # trap, which this project has fallen into four times. Free as well —
    # `objc2-core-foundation` is already in the build graph (5 occurrences in
    # the same `cargo tree` run).
    "objc2-core-foundation",
] }
# Named directly as of C2, which overturns the note this replaces ("deliberately
# NOT a direct dependency: nothing under src/ names it"). Rust-side pipeline
# creation cannot avoid it: `newFunctionWithName:` takes `&NSString`,
# `functionNames()`/`members()` return `NSArray`, and `newLibraryWithURL:` takes
# `&NSURL`. No new download and no new compile — objc2-foundation is already in
# Cargo.lock and already builds as objc2-metal's own dependency; this only makes
# it nameable.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSURL",
] }
# MetalFX (src/mtl/mfx.rs) — Apple's temporal upscaler, a second consumer of the
# same G-buffer `mtl::fsr3` feeds FidelityFX. No shim, no shader transpile, no
# SDK fetch: a system framework, so this arm works on a bare clone.
#
# TWO CONSEQUENCES WORTH KNOWING BEFORE EDITING EITHER LIST.
#
# (1) It raises the macOS RUNTIME FLOOR of the whole binary to 13.0.
# `objc2-metal-fx` carries an unconditional
# `#[link(name = "MetalFX", kind = "framework")]`, and MTLFXTemporalScaler is
# API_AVAILABLE(macos(13.0)) — so MetalFX.framework becomes an LC_LOAD_DYLIB of
# every macOS build, including bare checkouts that will never run the gate. On
# an older macOS the process does not launch AT ALL; it is not a graceful skip.
# Accepted deliberately (macOS 13 shipped in 2022 and this tree already needs
# Xcode-26-era tooling to generate the FSR3 metallibs), and stated in README's
# OS row rather than only here. The alternative — an optional cargo feature —
# was rejected because it would make a gate's availability depend on build
# flags rather than on the command line.
#
# (2) It WIDENS the deliberately-short objc2-metal list above, invisibly.
# `MTLFXTemporalScaler.h` imports Metal/MTL4Compiler.h and uses id<MTLFence>, so
# the crate feature additively enables `objc2-metal/MTL4Compiler` and
# `objc2-metal/MTLFence` for the whole graph. Those two are therefore in the
# build without appearing in the list above — which is why this comment exists,
# and why "the list is deliberately SHORT" is no longer the whole truth.
#
# `std` is NOT implied by the effect feature (the crate has `std = ["alloc"]`),
# so it must be named explicitly under `default-features = false`. MTL4* — the
# Metal 4 command-buffer variants — are deliberately absent.
objc2-metal-fx = { version = "0.3", default-features = false, features = [
    "std",
    "MTLFXTemporalScaler",
    "MTLFXTemporalDenoisedScaler",
    "MTLFXFrameInterpolator",
] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
# 16 CGUs, not 1 (adopted 2026-07-23): ThinLTO is DESIGNED for many CGUs —
# parallel per-unit codegen with cross-unit inlining via summaries — and cgu=1
# was serializing it into a fat-LTO-shaped single pass. Measured on this tree:
# one-line-touch rebuild 198 -> 45 s (4.4x), full rebuild 72 s, priced at
# +1-2% CPU-tracer ms/frame (interleaved 600-frame --spin path medians:
# default scene 49.01 -> 49.96, san-miguel-low-poly 47.87 -> 48.42).
# CPU benchmark numbers recorded before this date carry that offset.
# `codegen-units = 1` is the one-line revert if a measurement ever needs the
# last 2% back — re-price it with the same interleaved spin A/B if so.
codegen-units = 16
# Line tables so samplers (Tracy sampling, PIX timing captures, WPA) can
# symbolize release frames; no runtime cost.
debug = "line-tables-only"

# Iteration-only profile: optimized, but without the ThinLTO whole-program pass
# (measured on a one-line touch of main.rs: ~45 s under `release` at cgu=16,
# ~25 s here — and ~123 s under the old cgu=1 release).
#
# NEVER BENCHMARK UNDER THIS PROFILE. Every performance number this project
# reports — `--check`'s A/B bench rows, the hemi-share kill criterion ("if
# share-on is not measurably faster, the feature does not merge"), the adopt
# on/off regression guards — is only meaningful under `release`'s lto = "thin" +
# codegen-units = 16. Use `quick` to find compile errors and to exercise the
# exact-zero correctness gates (which are perf-independent); use `--release` for
# anything that prints a number.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
