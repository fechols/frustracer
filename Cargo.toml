[package]
name = "frustracer"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.30"
rayon = "1.10"
tobj = "4"
image = "0.25"
fastrand = "2"
# CPU profiler (Tracy). Off by default — without `--features tracy` this dep
# is not even compiled and every prof:: hook is an inert no-op. The crate
# version pairs 1:1 with a Tracy server (GUI) protocol version — see the
# Profiling section in CLAUDE.md before bumping either side.
tracy-client = { version = "0.17.6", optional = true, default-features = false, features = ["enable", "broadcast"] }

[features]
tracy = ["dep:tracy-client"]

# The interactive presentation stack (SDL2 window + D3D12 + Streamline) is
# Windows-only; headless --check/--check-dlss build everywhere without it.
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link", "raw-window-handle"] }
raw-window-handle = "0.6"
half = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    # Interface types + CLSIDs only — DxcCreateInstance is resolved at runtime
    # via GetProcAddress (gpu/dxc.rs) so nothing imports dxcompiler.dll.
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables so samplers (Tracy sampling, PIX timing captures, WPA) can
# symbolize release frames; no runtime cost.
debug = "line-tables-only"
